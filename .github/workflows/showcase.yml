name: Deploy interactive showcase

on:
  push:
    branches: [main]
    paths:
      - apps/showcase/**
      - apps/web/components/**
      - apps/web/lib/**
      - apps/web/app/*.css
      - apps/web/app/styles.ts
      - apps/web/themes/**
      - packages/**
      - docs/assets/**
      - scripts/build/showcase*.ts
      - scripts/verify/**
      - scripts/i18n/**
      - docs/*.md
      - tests/showcase/**
      - showcase.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/showcase.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:ui
      - run: npm run validate:themes
      - run: npm run validate:i18n
      - run: npm run docs:check
      - run: npm test
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm run showcase:build
        env:
          SHOWCASE_BASE: /axiom-notepad/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:showcase -- --project=chromium
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/showcase/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
