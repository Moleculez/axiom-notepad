# Include inside the existing HTTPS server block. Keep APP_URL at its public
# origin; Next.js may internally reconstruct a different request URL.
# Change 3000 only when the application listener uses a different port.
location = /mcp {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streamable HTTP does not use WebSocket Upgrade headers.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 5500000;
}
